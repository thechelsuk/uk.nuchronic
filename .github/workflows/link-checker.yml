name: Link Checker
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
  issues: write
jobs:
  links:
    uses: thechelsuk/workflows/.github/workflows/link-checker.yml@main
    with:
      site_host: nuchronic\.uk
      ruby_version: "3.2"
      # meassociation.org.uk serves a bot challenge ("One moment, please...")
      # and answers a burst of requests with 404s, so its links can't be checked.
      extra_args: --exclude 'meassociation\.org\.uk'
