{% assign footer = site.footer_nav %}
<footer class="site-footer">
    <div class="footer-brand">
        <p class="footer-copy h-card">&copy; {{ footer.year }}
            <a class="p-name u-url" href="https://nuchronic.uk" rel="me">nuchronic.uk</a> by
            <a href="https://thechels.uk">thechelsuk</a>.
        </p>
        <p class="footer-notice">{{ footer.notice }}</p>
    </div>
    <nav class="footer-groups" aria-label="Footer navigation">
        {% for group in footer.groups %}
        <section class="footer-group">
            <h2 class="footer-heading">{{ group.title }}</h2>
            <ul class="footer-list">
                {% for item in group.links %}
                <li><a href="{% if item.url contains '://' %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if item.rel %} rel="{{ item.rel }}"{% endif %}>{{ item.label }}</a></li>
                {% endfor %}
            </ul>
        </section>
        {% endfor %}
    </nav>
</footer>
